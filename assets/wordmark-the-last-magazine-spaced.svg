<!-- THE LAST MAGAZINE - in the hand-drawn MAILLE / SEZANE letters of
     assets/wordmark-the-new-critic-maille-site.svg (2026-10-14, "Create an
     svg that says THE LAST MAGAZINE in the same hand drawn font").
     T, H, E, I and N are that drawing's letters as they stand. The rest are
     built from its parts: L the E's stem and bottom arm under the I's top
     serif; A the W's first V turned over (thick right stroke, a heavier thin left,
     the W's serifs as feet) with a thin bar; M the N's thin stem, foot and
     corner, a thick diagonal to a W vertex, a thin one up to a thick stem
     with the H's serifs; Z the E's top beak turned left, its bottom beak,
     a thick diagonal between; G the C with a spur under a serif; S the C's
     top curve and beak at the top, the same turned over at the bottom,
     its upper left as heavy as its lower right.
     Letters as outlines, one path each, no background. Three words, the
     word space THE NEW CRITIC's (288). -->
<!-- (respaced 2026-10-14 — "Space the letters exactly like THE NEW CRITIC": each letter's ink the gap THE NEW CRITIC's drawing leaves after the same letter pair, 64.8 where it has no such pair, the words 288 apart; made from assets/wordmark-the-last-magazine.svg by a translate on each letter) -->
