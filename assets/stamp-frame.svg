     outline of the bird with the red here", with a picture of a red seal):
     the seal's border redrawn from the picture's measures, in the
     wordmark's cap units (600 tall). Thin rough top and sides, the foot
     about four times their weight, the corners softly rounded, a break in
     the top right of its middle with a speck of ink over the top left of
     it, a dip in the foot under the middle, its edges roughened as the
     letters' drawn edges are. The bird stands on the counter's middle,
     near filling it (#bird-seat, the transform build.js puts on the
     bird's own drawing); where it crosses the border the colour flips.
     build.js reads #frame and #bird-seat, paints the border in the
     highlight (--nc-mark), and the box's width over its height sets the
     stamp's aspect (--bird-ar). The square frame before it, at the
     letters' weight with an opening along the bird's spine, is in the
     history (stamp-frame.svg at 0971baf). -->
