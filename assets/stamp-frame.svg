<!-- THE STAMP'S FRAME (2026-10-08, at the user's word, "Replace the
     outline of the bird with the red here", with a picture of a red seal):
     the seal's border redrawn from the picture's measures, in the
     wordmark's cap units (600 tall). Thin rough top and left side, the foot
     and the right side about four times their weight ("Thicken the right
     edge of the bird border like the bottom"), the corners softly rounded, a break in
     the top right of its middle with a speck of ink over the top left of
     it, a dip in the foot under the middle, the
     seal narrowed so its counter stands a tenth taller than wide ("Make
     the white a little taller than it is long"), its edges roughened as the
     letters' drawn edges are. The bird's ink stands centred in the
     counter ("Center the bird in the white too"), its wings as far from
     the border's ink on the right as on the left, measured off a render
     ("should be same distance from ink of border to right wing as there
     is from ink of border to left wing"), turned 20.9 degrees so its beak points into the
     counter's bottom left corner ("point the beak of the bird into the
     bottom left corner") (#bird-seat, the transform build.js puts on the
     bird's own drawing); where it crosses the border the colour flips.
     build.js reads #frame and #bird-seat and paints the border in the
     ink, charcoal ("Make the border charcoal", where it was the
     highlight); the box's width over its height sets the stamp's aspect
     (--bird-ar). The square frame before it, at the
     letters' weight with an opening along the bird's spine, is in the
     history (stamp-frame.svg at 0971baf). -->
