<!-- THE STAMP (2026-10-08, at the user's words, with a picture of the bird
     in a hand-drawn box: "I want the bird to be in a box of this shape. The
     bird and border should be in the highlight color, with black below the
     wings filled in and white above the wings filled in"). Traced from the
     picture (the session's images/11.jpg), in the wordmark's cap units, the
     box 600 tall: #frame the box's wavering border; #bird the bird as the
     picture draws it, its wings opened wider than the site's earlier
     drawing, moved since — a turn of 8 degrees, a scale of 1.13 — so the
     upper wing's tip touches the counter's top left corner and the lower
     wing's its bottom right ("Adjust so one wing tip touches one corner
     and the other wing tip touches the other"), the tail running into the
     top border and the beak into the bottom left corner (build.js clips
     the bird to the box's outer edge, #outer); #under the box's outer
     edge pulled 4 in, the fill painted to it so its edge lies under the
     border and no hairline shows between them ("Make sure there are no
     hairlines");
     #counter the white inside the border; #below the white under the wings
     — the regions the bird cuts off from the top border, and the white
     between the beak's mandibles ("Fill in the area with the beak that's
     white with charcoal") — to be filled black, carried a little in under
     the bird's ink so no white shows at the beak's tip. build.js paints the whole counter in the ink, charcoal on the
     light side and light on the dark ("Keep bird highlight color/make
     stamp fill all charcoal, invert on dark theme"; #below, the white and
     black split, is kept but unused), and the border and the bird in the
     highlight (--nc-mark); the box's width over its height sets the stamp's aspect
     (--bird-ar). The seal before it, and the square frame before that, are
     in the history (stamp-frame.svg at fda9e13 and 0971baf). -->
