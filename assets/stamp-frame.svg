<!-- THE STAMP'S FRAME (2026-10-07, at the user's words: "Make a version of
     the bird, where there's an outline for the stamp with the same
     thickness and curves as the letter, with a slanted opening like the
     opening of the C"; "Have the opening be diagonal"; "Leave room for the
     bird, adjust accordingly"; "I want the opening to be larger and to line
     up with the direction of the beak, along that curve of the bird's
     spine. I want the outer corners to be as round as the inner corners";
     "make the border 10-15% thinner. Bird feels too small rn"; "Make the border more square at the corners, like the corners of the N").
     In the wordmark's cap units (600 tall, as the letters are): a rounded
     box at seven-eighths of the O's own weights (sides 107, top 96, foot
     94), its corners square as the N's, softened only as the letters' are by the tracing.
     The bird sits in the counter with 24 of air all round, scaled to fit
     (#bird-seat, the transform build.js puts on the bird's own drawing).
     The opening goes through the left side along the bird's spine (a curve
     fitted to the neck and the tail, carried on past the beak), 87
     across. build.js reads #frame and #bird-seat; the box's width over its
     height sets the stamp's aspect (--bird-ar). -->
