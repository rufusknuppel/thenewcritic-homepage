<!-- THE NEW CRITIC - the wordmark. This file is the one source of the name.
     The name in the MAILLE / SEZANE lettering (2026-10-06, "Use this as
     the site wordmark"): tapered slab serifs, beaked T and E, the W two
     equal Vs crossed at the middle under one lid; the E's top arm 96% of
     its bottom one, the letters 0.19-0.23 of the cap apart ("Move letters
     closer together. Make top of E 90% of length of bottom of E", then "95%", then "97.5%", then "Move back to 96%"; "Reduce gaps between the letters in the wordmark"); every serif one sweep from the stroke to a thin round tip, as the R's tail ends ("Make the ends of the letters pointier"; "Points should look like the end of the r").
     Edit it in Illustrator, Figma or Inkscape and run `node build.js`:
     the build finds the three words by the two widest spaces between
     letters, the cap line and baseline from the letters themselves, and
     splits CRITIC at its middle for the stacked masthead. Keep only the
     letters in the file - no background, text as outlines. Colour is set
     by the site. -->
