<!-- THE NEW CRITIC - the wordmark. This file is the one source of the name.
     Drawn from Garamond Premier Pro Bold Display caps and reworked by
     hand: tops and bottoms straight, the E's arms even, the right halves
     of the H, the R and the W's second V at 75% of their weight, the gaps
     opened. One path per letter (the W is its two Vs, overlapping).
     Edit it in Illustrator, Figma or Inkscape and run `node build.js`:
     the build finds the three words by the space between them, the cap
     line and baseline from the letters themselves, and splits CRITIC at
     its middle for the stacked masthead. Keep only the letters in the
     file - no background, text as outlines. Colour is set by the site. -->
