<?xml version="1.0" encoding="UTF-8"?>
<!-- THE NEW CRITIC - the wordmark. This file is the one source of the name.
     The name in the LODÉHO letters (2026-10-07, "Make it the site's
     wordmark"): a heavy ultra-condensed grotesque with slot counters,
     traced from the poster's print itself, so the edges carry the ink's
     own raggedness, well softened; the C's hooks reach to 0.34 and
     0.66 of the cap. O, D, E and H are the poster's letters as printed;
     I is a straight stem at the L's width; T that stem under a straight
     bar at the E's arm height, as wide as the H; C the O with its right flank cut, its back straight where it
     runs straight; R the D's bends rejoined, on a stem drawn straight,
     into
     a bowl 0.57 of the cap over a leg that is the O's top-right quarter
     turned over, a hook like the C's, landing straight on the baseline, the slot under the bowl as wide
     as the O's counter; N two L-stems and a diagonal; W four
     parallel strokes of one thickness, its feet as wide as its apex
     flat, apex on the cap line, its three notches alike, 0.46 of the cap
     deep (the user's pick of seven; back on 2026-10-08, "This is the
     shape"). THE, with a line under it (2026-10-08, after the TNC
     monogram, "Do the same with THE on the site, have the line run under
     the whole word"): its letters scaled by 0.732 from the top left, so
     that they, a gap of a stroke and a line a stroke deep (the T's own
     crossbar, drawn out to the word's width), all at that scale, stand
     as tall as NEW and CRITIC; the words behind it moved up to keep the
     word space. Letters 0.10 of the cap apart
     (0.12 beside a round side), the words 0.36 apart. Charcoal #121417
     here; the site sets its own colour. The same drawing is kept as
     assets/wordmark-the-new-critic-lodeho.svg; the MAILLE lettering
     before it is assets/wordmark-the-new-critic-maille.svg.
     Edit it in Illustrator, Figma or Inkscape and run `node build.js`:
     the build finds the three words by the two widest spaces between
     letters, the cap line and baseline from the letters themselves, and
     splits CRITIC at its middle for the stacked masthead. Keep only the
     letters in the file - no background, text as outlines. -->
