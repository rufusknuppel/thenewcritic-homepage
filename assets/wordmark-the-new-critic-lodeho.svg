<!-- THE NEW CRITIC in the LODÉHO letters (2026-10-07, "Use these shapes to
     create an SVG wordmark for THE NEW CRITIC. Make it realistic"): traced
     from the print itself, not redrawn. O, D, E and H are the poster's
     letters pixel for pixel (the E without its accent). I is the L's
     stem; T that stem under a crossbar made of the E's top arm, as wide
     as the H ("I'd like T to be more like the H and E", "I want ts to be
     the same width as the H"); C the O with its right flank cut
     between 0.34 and 0.66 of the cap ("make hooks of C's slightly longer"); R the D's two bends rejoined into a
     bowl 0.57 of the cap over a leg; N two L-stems joined by a diagonal;
     W four strokes at the same weight, its middle apex on the cap line
     and its middle notch stopping at 0.53 of the cap ("Want the bottom
     of the W to run less deep"). The edges carry the print's own
     raggedness, softened a little ("Make sides of letters slightly
     smoother"), and the synthetic edges were given the same; the R's leg springs from the stem at the bowl's foot and runs
     out to the bottom right, so the lower counter is a triangle ("want the
     leg of the R to form a triangle in the interior"), its foot cut on a
     slant to a point at the right corner ("let the right corner of the r
     form a point"). Flat outlines, no
     filter ("no filter just flat"), the ink the site's charcoal #121417
     ("Should be pure charcoal on white"); no background in the file. Cap
     height 600. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4374.8 600" width="4374.8" height="600" role="img" aria-label="The New Critic">
