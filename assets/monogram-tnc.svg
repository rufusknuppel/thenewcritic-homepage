<!-- The mark (2026-10-09). The file keeps the name monogram-tnc.svg from when it
     carried T, N and C. After the user's third picture ("I want this, but
     with the more detailed bird, and white/charcoal only"): a square with a
     thin border, the bird across it corner to corner; the picture's red
     made white, its charcoal kept. In 1300: #border 20 wide (3.5 of the
     picture's 231), white; #field the charcoal inside it; #bird the
     stamp's (#bird in assets/stamp-frame.svg, the specks in it kept, none
     outside), white, turned -27.3 degrees - of the angles that keep its beak toward
     the bottom left and its tail toward the top right, the one at which it
     fills the field biggest whole - and centred in the field, as big as
     the field takes (the picture's wing tips in the corners would have run
     the stamp's tail off the top: the picture's bird sweeps its wings back
     further). On the site (build.js) the white takes the
     page's ground and the charcoal the page's ink. -->
