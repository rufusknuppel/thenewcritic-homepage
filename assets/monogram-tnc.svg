<!-- TNC - the monogram (2026-10-08, "Create an SVG like this but using the
     T N and C from the wordmark ... and the box beneath it"; the T then
     whole, and to the left of the N). After an HVD mark: a square with the letters knocked out,
     set low. N, T and C are the letters of
     assets/wordmark.svg as drawn, T, N and C in that order at the
     wordmark's own spacing (0.10 of the cap, 0.12 beside the C's round
     side). Under the T, a stroke below
     it, is a box that is the T's own crossbar; the T and box together are
     scaled by 0.732 so the pair is as tall as the N and C, the
     box's foot on their baseline. The letters centred across the square,
     the baseline where the HVD mark's is. One
     path, even-odd, so the letters are holes; charcoal #121417 as in the
     wordmark. -->
