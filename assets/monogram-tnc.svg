<!-- The mark (2026-10-09). The file keeps the name monogram-tnc.svg from when it
     carried T, N and C. After the user's picture of the old stamp ("Use this
     shape and angle for the the bird, put the bird an thin outline ... the
     box should be a rectangle that contains the beak and the tail but the
     wings should overflow this"): the stamp's bird (#bird in
     assets/stamp-frame.svg) as it stands there - its shape, its angle, the
     specks in it - and a rectangle drawn 36 beyond the beak's tip and the
     tail's, then a quarter taller about its middle, twice ("Make the box
     25% taller"), then its foot let down a quarter of its height ("Expand
     only the bottom of the box by 25%") and taken up a tenth ("reduce
     bottom by 10%"), so the beak and the tail are inside it and the wings run
     out over its top and its foot. Coloured since ("Make the bird white
     within the box. Make the box charcoal, make the outline highlight color
     and make the wings over the outline and outside the box charcoal", then
     "Make the whole bird black and the inside of the box white"): #field
     the box, white ("revert to white fill" - it was black for a while,
     the bird white within it); #box its outline, charcoal ("make outline
     black too" - it was the highlight), 19.4 wide, twice the stamp
     frame's ("double thickness of the outline"); #bird charcoal, the whole
     of it, drawn over the outline where the wings cross it, the specks in
     it the white inside the box and the page outside it. All of it turned a quarter clockwise, so the bird
     faces up ("Flip the whole thing 90 degrees so the bird faces up"):
     the beak at the top, the tail at the foot, the wings out at the
     sides. #ground the whole drawing's box,
     unpainted: the band measures the mark by it. On the site (build.js)
     the charcoal takes the page's ink and the white the page's ground -
     inverted on the dark side. -->
