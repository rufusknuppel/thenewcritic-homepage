<!-- The monogram (2026-10-08/09; the file keeps its name, monogram-tnc.svg,
     from when it carried T, N and C - "Remove the letters and move the bird
     to the top right" took them out). After an HVD mark: a square with the
     mark knocked out, now the bird alone. The bird is the stamp's (#bird in
     assets/stamp-frame.svg) with the specks in it and none of those outside
     it, turned -31.2 degrees so its beak points down and left, the
     line from its tail's tip to its beak's on the square's diagonal ("make
     the bird point into the bottom corner"), 0.864 of its size in
     the stamp, where the stamp is a cap tall: a third of the square wide
     less the margin, the width the letters had ("make it the same size as
     the letters"). Its box in the top right corner, 79 in from the
     square's edges. One path, even-odd, so the bird is a hole and its
     specks the square's colour; charcoal #121417 as in the wordmark. -->
