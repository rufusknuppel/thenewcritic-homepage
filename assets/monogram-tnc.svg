<!-- The mark (2026-10-09). The file keeps the name monogram-tnc.svg from when it
     carried T, N and C. The user's own drawing of the bird ("Use this for the
     bird": assets/bird-edited.svg, as they gave it), its ink as drawn - the
     gap between the upper wing and the body, the slit in the beak and the
     tail's fork all in it - set at 0 0, its box its ink. #ground that box,
     unpainted: the band measures the mark by it. On the site (build.js) the
     charcoal takes the page's ink, inverted on the dark side. Before it,
     a bird drawn from the old stamp by stamp-gen3.js in the session's
     scratchpad, its history in this file's git log. -->
